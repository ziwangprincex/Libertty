<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; font-src file:; img-src 'none'; connect-src 'none'">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  #editor { height: 100%; }
  .cm-editor.cm-focused { outline: none; }
  #banner { position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 10; display: flex; gap: 10px; align-items: center;
    padding: 8px 12px; border-radius: 10px; font: 12.5px -apple-system, system-ui, sans-serif;
    background: var(--banner-bg); color: var(--banner-fg); box-shadow: 0 0 0 1px var(--banner-line), 0 6px 20px rgba(0,0,0,.25); }
  #banner span { flex: 1; }
  #banner button { font: inherit; color: inherit; background: var(--banner-line); border: 0; border-radius: 6px; padding: 4px 10px; }
</style></head>
<body><div id="editor"></div><script src="editor.js"></script></body></html>
